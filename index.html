<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Алгоритм оюндары</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: indigo classroom header band, pill tabs, one game "board" card per tab; chunky tappable buttons for a projector or phone. */
:root{
  --bg:#FBF7F0; --surface:#FFFDF9; --sunk:#F3E9DC; --line:#E6DFD3;
  --ink:#1F1B4D; --soft:#4B4870; --band:#1F1B4D; --band-ink:#FBF7F0; --band-soft:#C9C5E8;
  --accent:#E8833A; --accent-ink:#1F1B4D; --accent-text:#A84F10;
  --ok:#1F7A70; --ok-bg:#DDF0EC; --bad:#B23A2B; --bad-bg:#F8E1DC;
  --code-bg:#1F1B4D; --code-ink:#FBF7F0; --code-kw:#F2A65A; --code-str:#8FD6C9;
  --cell:#FFFDF9; --wall:#1F1B4D; --star:#F2C14E;
  --f-display:'Rubik','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15123A; --surface:#1F1B4D; --sunk:#2B2763; --line:#3A3580;
  --ink:#FBF7F0; --soft:#C9C5E8; --band:#0F0C2E; --band-ink:#FBF7F0; --band-soft:#C9C5E8;
  --accent:#F2A65A; --accent-ink:#1F1B4D; --accent-text:#F2A65A;
  --ok:#5CC9B8; --ok-bg:#163F3B; --bad:#F08A7A; --bad-bg:#4A1F27;
  --code-bg:#0F0C2E; --code-ink:#FBF7F0; --cell:#2B2763; --wall:#0B0926; --star:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15123A; --surface:#1F1B4D; --sunk:#2B2763; --line:#3A3580;
  --ink:#FBF7F0; --soft:#C9C5E8; --band:#0F0C2E; --band-ink:#FBF7F0; --band-soft:#C9C5E8;
  --accent:#F2A65A; --accent-ink:#1F1B4D; --accent-text:#F2A65A;
  --ok:#5CC9B8; --ok-bg:#163F3B; --bad:#F08A7A; --bad-bg:#4A1F27;
  --code-bg:#0F0C2E; --code-ink:#FBF7F0; --cell:#2B2763; --wall:#0B0926; --star:#F2C14E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-ink)}
header .wrap{padding-block:28px 22px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,48px);line-height:1.05;margin:0;text-wrap:balance}
header p{margin:0;color:var(--band-soft);max-width:60ch}
.score{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.score span{font-size:14px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.score b{color:var(--accent)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.tab{flex:none;font:700 15px var(--f-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);padding:9px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:24px 56px}
.game{display:flex;flex-direction:column;gap:18px}
.game h2{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);margin:0;line-height:1.15}
.lead{margin:0;color:var(--soft);max-width:65ch}
.board{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:800 15px var(--f-body);border:2px solid transparent;border-radius:14px;padding:11px 16px;cursor:pointer;background:var(--sunk);color:var(--ink);min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.mono{font-family:var(--f-mono);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:transparent}
.msg{border-radius:14px;padding:12px 16px;font-weight:700;background:var(--sunk)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.label{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
/* robot */
.robot-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.robot-layout{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;gap:4px;background:var(--line);padding:4px;border-radius:16px;width:100%;max-width:520px;aspect-ratio:var(--ar)}
.cell{background:var(--cell);border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center}
.cell.wall{background:var(--wall)}
.cell.trail::after{content:"";width:22%;height:22%;border-radius:50%;background:var(--ok);opacity:.6}
.star{width:62%;height:62%;background:var(--star);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.bot{position:absolute;inset:12%;border-radius:22%;background:var(--accent);display:flex;align-items:flex-start;justify-content:center;transition:transform .3s ease;z-index:2}
.bot::before{content:"";margin-top:8%;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:13px solid var(--accent-ink)}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;background:var(--sunk);border-radius:14px;padding:8px}
.prog .c{font:700 14px var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
.prog .c.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog .c.badc{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.prog .empty{color:var(--soft);padding:6px}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{font:800 14px var(--f-body);padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
/* order */
.slots{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slot{display:flex;align-items:center;gap:12px;min-height:50px;border:2px dashed var(--line);border-radius:14px;padding:6px 12px;background:var(--bg)}
.slot::before{counter-increment:s;content:counter(s);font:800 16px var(--f-display);width:30px;height:30px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none}
.slot button{flex:1;text-align:left}
.slot.good{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.chip{font:700 15px var(--f-body);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.slot .chip{border:none;background:transparent;padding:4px 0}
/* quiz-like */
.q{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qnum{font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.2vw,26px);line-height:1.25;margin:0;text-wrap:balance}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);font:400 clamp(15px,2.4vw,19px)/1.6 var(--f-mono);padding:16px 20px;border-radius:14px;overflow-x:auto}
pre.code .k{color:var(--code-kw)} pre.code .s{color:var(--code-str)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{text-align:left;font:700 16px var(--f-body);background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.mono{font-family:var(--f-mono)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.explain{margin:0;color:var(--soft)}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.final{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:12px}
.big{font:800 clamp(56px,12vw,96px)/1 var(--f-display);color:var(--accent-text);font-variant-numeric:tabular-nums}
.langs{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">Информатика · Интерактивдүү оюндар</span>
    <h1>Алгоритм оюндары</h1>
    <p>Роботту башкар, кадамдарды иретке кой, программалоо тилин танда жана Python кодунун жыйынтыгын тап.</p>
    <div class="score" id="score" aria-live="polite"></div>
  </div>
</header>
<nav aria-label="Оюндар">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>
<main>
  <div class="wrap" id="view"></div>
</main>

<script>
(function(){
var S={robot:0,order:0,lang:0,out:0,test:0};
var MAX={robot:3,order:4,lang:7,out:9,test:10};
var NAMES={robot:"Робот",order:"Иреттөө",lang:"Тилдер",out:"Эмне чыгат?",test:"Тест"};
function score(){var h="";for(var k in S){h+="<span>"+NAMES[k]+": <b>"+S[k]+"</b> / "+MAX[k]+"</span>";}document.getElementById("score").innerHTML=h;}
function el(t,cls,txt){var e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hl(code){var h=esc(code);h=h.replace(/(&quot;|")(.*?)(")/g,'<span class="s">"$2"</span>');h=h.replace(/\b(print|input|int|float|for|in|range|if|else|elif|type)\b/g,'<span class="k">$1</span>');return h;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var TABS=[["robot","Робот программист"],["order","Кадамдарды иретке кой"],["lang","Тилди танда"],["out","Эмне чыгат?"],["test","Жыйынтыктоочу тест"]];
var cur="robot";
function tabs(){var t=document.getElementById("tabs");t.innerHTML="";TABS.forEach(function(x){var b=el("button","tab",x[1]);b.setAttribute("role","tab");b.id="tab-"+x[0];b.setAttribute("aria-selected",x[0]===cur?"true":"false");b.onclick=function(){cur=x[0];tabs();render();};t.appendChild(b);});}
function render(){var v=document.getElementById("view");v.innerHTML="";({robot:robot,order:order,lang:lang,out:out,test:test})[cur](v);}

/* ---------- 1. ROBOT ---------- */
var LEVELS=[
 {c:5,r:4,x:0,y:3,d:1,w:[[2,3],[2,2]],s:[3,1],hint:"Робот оңго карап турат. Дубалды айланып өт!"},
 {c:5,r:5,x:0,y:4,d:0,w:[[0,1],[1,1],[2,3],[3,3]],s:[4,0],hint:"Робот өйдө карап турат. Жылдыз жогорку оң бурчта."},
 {c:6,r:5,x:0,y:0,d:1,w:[[2,0],[2,1],[2,2],[4,1],[4,2],[4,3]],s:[5,4],hint:"Узун жол! Адегенде ылдый түш."}
];
var R={lv:0,prog:[],running:false,done:[false,false,false]};
function robot(v){
 var L=LEVELS[R.lv];
 var g=el("section","game");
 g.appendChild(el("h2",null,"Робот программист"));
 g.appendChild(el("p","lead","Командаларды басып программа түз, анан «Иштет» бас. Робот жылдызга жетиши керек. Роботтун командалар системасы: FORWARD, LEFT, RIGHT."));
 var lvs=el("div","levels");LEVELS.forEach(function(_,i){var b=el("button","lv",(i+1)+"-деңгээл"+(R.done[i]?" ✓":""));b.setAttribute("aria-pressed",i===R.lv?"true":"false");b.onclick=function(){if(R.running)return;R.lv=i;R.prog=[];render();};lvs.appendChild(b);});
 g.appendChild(lvs);
 var lay=el("div","robot-layout");
 var left=el("div","board");
 var grid=el("div","grid");grid.style.gridTemplateColumns="repeat("+L.c+",1fr)";grid.style.setProperty("--ar",L.c+" / "+L.r);
 var cells=[];for(var y=0;y<L.r;y++){for(var x=0;x<L.c;x++){var c=el("div","cell");if(L.w.some(function(w){return w[0]===x&&w[1]===y;}))c.className="cell wall";if(L.s[0]===x&&L.s[1]===y)c.appendChild(el("div","star"));cells.push(c);grid.appendChild(c);}}
 left.appendChild(grid);
 var hint=el("p","explain",L.hint);left.appendChild(hint);
 lay.appendChild(left);
 var right=el("div","board");
 right.appendChild(el("span","label","Программа"));
 var prog=el("div","prog");right.appendChild(prog);
 var cmds=el("div","row");
 [["FORWARD","Алга"],["LEFT","Солго"],["RIGHT","Оңго"],["JUMP","Секир"]].forEach(function(c){var b=el("button","btn mono",c[0]);b.title=c[1];b.onclick=function(){if(R.running)return;if(R.prog.length>=24)return;R.prog.push(c[0]);drawProg();};cmds.appendChild(b);});
 right.appendChild(cmds);
 var ctr=el("div","row");
 var run=el("button","btn primary","▶ Иштет");var undo=el("button","btn","Акыркысын өчүр");var clr=el("button","btn","Тазала");
 ctr.appendChild(run);ctr.appendChild(undo);ctr.appendChild(clr);right.appendChild(ctr);
 var msg=el("div","msg","Программаны түзүп, «Иштет» бас.");msg.setAttribute("aria-live","polite");right.appendChild(msg);
 lay.appendChild(right);g.appendChild(lay);v.appendChild(g);
 var bot=el("div","bot");
 function place(x,y,d){var c=cells[y*L.c+x];c.appendChild(bot);bot.style.transform="rotate("+(d*90)+"deg)";}
 function drawProg(hi,bad){prog.innerHTML="";if(!R.prog.length){prog.appendChild(el("span","empty","Азырынча бош"));return;}R.prog.forEach(function(c,i){var s=el("span","c",(i+1)+". "+c);if(i===hi)s.className="c on";if(i===bad)s.className="c badc";prog.appendChild(s);});}
 function reset(){cells.forEach(function(c){c.classList.remove("trail");});place(L.x,L.y,L.d);}
 undo.onclick=function(){if(R.running)return;R.prog.pop();drawProg();};
 clr.onclick=function(){if(R.running)return;R.prog=[];drawProg();reset();msg.className="msg";msg.textContent="Программа тазаланды.";};
 run.onclick=function(){
  if(R.running)return;if(!R.prog.length){msg.className="msg bad";msg.textContent="Программа бош! Адегенде команда кош.";return;}
  R.running=true;reset();var x=L.x,y=L.y,d=L.d,k=0;msg.className="msg";msg.textContent="Робот программаны аткарып жатат…";
  function stop(ok,text,badIdx){R.running=false;msg.className="msg "+(ok?"ok":"bad");msg.textContent=text;drawProg(-1,badIdx);if(ok&&!R.done[R.lv]){R.done[R.lv]=true;S.robot++;score();var b=lvs.children[R.lv];b.textContent=(R.lv+1)+"-деңгээл ✓";}}
  function step(){
   if(k>=R.prog.length){if(x===L.s[0]&&y===L.s[1])stop(true,"Азаматсың! Робот жылдызга жетти. Командалар: "+R.prog.length+".");else stop(false,"Программа бүттү, бирок робот жылдызга жеткен жок. Кайра аракет кыл!");return;}
   drawProg(k);var c=R.prog[k];
   if(c==="JUMP"){stop(false,"Ката! «JUMP» командасы роботтун командалар системасында жок. Робот аны аткара албайт.",k);return;}
   if(c==="LEFT")d=(d+3)%4;else if(c==="RIGHT")d=(d+1)%4;
   else{var nx=x+[0,1,0,-1][d],ny=y+[-1,0,1,0][d];
    if(nx<0||ny<0||nx>=L.c||ny>=L.r){stop(false,"Робот тордон чыгып кетти! "+(k+1)+"-командада ката бар.",k);return;}
    if(L.w.some(function(w){return w[0]===nx&&w[1]===ny;})){stop(false,"Робот дубалга урунду! "+(k+1)+"-командада ката бар.",k);return;}
    cells[y*L.c+x].classList.add("trail");x=nx;y=ny;}
   place(x,y,d);k++;setTimeout(step,480);}
  setTimeout(step,300);
 };
 drawProg();reset();
}

/* ---------- 2. ORDER ---------- */
var TASKS=[
 {t:"Эртең менен мектепке даярдануу",s:["Ойгонуу","Төшөктөн туруу","Бетти жуу","Кийим кийүү","Эртең мененки тамак","Сумканы текшерүү","Мектепке чыгуу"]},
 {t:"Чай даярдоо",s:["Сууну алуу","Сууну кайнатуу","Чыныга чай салуу","Ысык суу куюу","Демдөө"]},
 {t:"Китепканадан китеп алуу",s:["Китепкананы табуу","Китепканага баруу","Керектүү китепти тандоо","Китепти каттатуу","Китепти алуу","Китепканадан чыгуу"]},
 {t:"Python программасын иштетүү",s:["Редакторду ачуу","Кодду терүү","Файлды сактоо","Программаны иштетүү","Натыйжаны текшерүү"]}
];
var O={i:0,pool:null,ans:[],done:[false,false,false,false]};
function order(v){
 var T=TASKS[O.i];if(!O.pool){O.pool=shuffle(T.s);O.ans=[];}
 var g=el("section","game");
 g.appendChild(el("h2",null,"Кадамдарды иретке кой"));
 g.appendChild(el("p","lead","Алгоритмде кадамдардын тартиби маанилүү! Кадамды басып, аны туура орунга кой. Ката койсоң, кайра басып кайтар."));
 var lvs=el("div","levels");TASKS.forEach(function(x,i){var b=el("button","lv",x.t+(O.done[i]?" ✓":""));b.setAttribute("aria-pressed",i===O.i?"true":"false");b.onclick=function(){O.i=i;O.pool=null;render();};lvs.appendChild(b);});g.appendChild(lvs);
 var b=el("div","board");
 b.appendChild(el("span","label","Алгоритм: "+T.t));
 var slots=el("div","slots");
 for(var i=0;i<T.s.length;i++){(function(i){var s=el("div","slot");if(O.ans[i]!=null){var c=el("button","chip",O.ans[i]);c.onclick=function(){O.pool.push(O.ans[i]);O.ans.splice(i,1);render();};s.appendChild(c);}else{s.appendChild(el("span","explain","…"));}slots.appendChild(s);})(i);}
 b.appendChild(slots);
 b.appendChild(el("span","label","Аралаш кадамдар"));
 var pool=el("div","row");O.pool.forEach(function(p,j){var c=el("button","chip",p);c.onclick=function(){O.ans.push(p);O.pool.splice(j,1);render();};pool.appendChild(c);});
 if(!O.pool.length)pool.appendChild(el("span","explain","Бардык кадамдар коюлду. Эми текшер!"));
 b.appendChild(pool);
